<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Payout Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 border border-slate-200">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Payout Calculator</h2>
        <p class="text-slate-500 text-sm mb-6">Calculates monthly payouts using the Equivalent Monthly Rate method.</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Deposit Amount ($)</label>
                <input type="number" id="principal" value="350000" class="w-full p-3 bg-slate-100 border-none rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-lg">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Annual Interest Rate (%)</label>
                <input type="number" id="rate" value="6.75" step="0.01" class="w-full p-3 bg-slate-100 border-none rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-lg">
            </div>
        </div>

        <div class="mt-8 bg-blue-600 rounded-xl p-6 text-white shadow-lg">
            <p class="text-blue-100 text-sm uppercase tracking-wider font-semibold">Estimated Monthly Payout</p>
            <div class="text-4xl font-bold mt-1">$<span id="payoutDisplay">1,958</span></div>
            
            <hr class="my-4 border-blue-400">
            
            <div class="grid grid-cols-2 gap-2 text-xs opacity-90">
                <div>Quarterly Rate: <span id="qRate">1.6875</span>%</div>
                <div>Monthly EMR: <span id="mRate">0.5594</span>%</div>
            </div>
        </div>

        <p class="mt-4 text-[10px] text-slate-400 text-center italic">
            Note: This formula assumes quarterly compounding discounted for monthly payouts.
        </p>
    </div>

    <script>
        const principalInput = document.getElementById('principal');
        const rateInput = document.getElementById('rate');
        const payoutDisplay = document.getElementById('payoutDisplay');
        const qRateDisplay = document.getElementById('qRate');
        const mRateDisplay = document.getElementById('mRate');

        function calculate() {
            const P = parseFloat(principalInput.value) || 0;
            const r = (parseFloat(rateInput.value) || 0) / 100;

            if (P > 0 && r > 0) {
                // 1. Quarterly Rate
                const quarterlyRate = r / 4;
                
                // 2. Equivalent Monthly Rate (EMR)
                // (1 + i_m)^3 = (1 + quarterlyRate)
                const monthlyRate = Math.pow(1 + quarterlyRate, 1/3) - 1;

                // 3. Final Payout
                const payout = P * monthlyRate;

                // Update UI
                payoutDisplay.innerText = Math.round(payout).toLocaleString();
                qRateDisplay.innerText = (quarterlyRate * 100).toFixed(4);
                mRateDisplay.innerText = (monthlyRate * 100).toFixed(4);
            } else {
                payoutDisplay.innerText = "0";
            }
        }

        // Add listeners for real-time updates
        principalInput.addEventListener('input', calculate);
        rateInput.addEventListener('input', calculate);
    </script>
</body>
</html>
