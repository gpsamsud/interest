<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Interest Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10 font-sans">

    <div class="max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-800 mb-6">Investment Calculator</h1>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-600">Principal Amount ($)</label>
                    <input type="number" id="principal" value="10000" class="w-full mt-1 p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-600">Annual Interest Rate (%)</label>
                    <input type="number" id="rate" value="5" class="w-full mt-1 p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-600">Period (Years)</label>
                        <input type="number" id="years" value="5" class="w-full mt-1 p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <div class="flex flex-col justify-end">
                        <label class="inline-flex items-center cursor-pointer mb-3">
                            <input type="checkbox" id="compound" class="sr-only peer">
                            <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                            <span class="ms-3 text-sm font-medium text-slate-600">Compound</span>
                        </label>
                    </div>
                </div>

                <button onclick="calculate()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all active:scale-95">
                    Calculate Payout
                </button>
            </div>
        </div>

        <div class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-indigo-600 p-5 rounded-2xl text-white shadow-md">
                    <p class="text-xs opacity-80 uppercase font-bold tracking-wider">Avg. Monthly</p>
                    <p id="monthlyPayout" class="text-2xl font-bold mt-1">$0.00</p>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Total Interest</p>
                    <p id="totalInterest" class="text-2xl font-bold text-slate-800 mt-1">$0.00</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-64">
                <canvas id="growthChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let myChart;

        function calculate() {
            const P = parseFloat(document.getElementById('principal').value);
            const r = parseFloat(document.getElementById('rate').value) / 100;
            const t = parseFloat(document.getElementById('years').value);
            const isCompounded = document.getElementById('compound').checked;

            let totalValue;
            let labels = [];
            let dataPoints = [];

            if (isCompounded) {
                // Compound: A = P(1 + r/n)^nt (Assuming monthly compounding n=12)
                totalValue = P * Math.pow((1 + r/12), 12 * t);
            } else {
                // Simple: A = P(1 + rt)
                totalValue = P * (1 + (r * t));
            }

            const totalInterest = totalValue - P;
            const avgMonthly = totalInterest / (t * 12);

            // Update UI
            document.getElementById('monthlyPayout').innerText = `$${avgMonthly.toLocaleString(undefined, {maximumFractionDigits: 2})}`;
            document.getElementById('totalInterest').innerText = `$${totalInterest.toLocaleString(undefined, {maximumFractionDigits: 2})}`;

            // Chart Logic
            for (let i = 0; i <= t; i++) {
                labels.push(`Year ${i}`);
                let val = isCompounded ? P * Math.pow((1 + r), i) : P * (1 + (r * i));
                dataPoints.push(val.toFixed(2));
            }

            updateChart(labels, dataPoints);
        }

        function updateChart(labels, data) {
            const ctx = document.getElementById('growthChart').getContext('2d');
            if (myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total Balance ($)',
                        data: data,
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: false } }
                }
            });
        }

        // Run on load
        calculate();
    </script>
</body>
</html>
