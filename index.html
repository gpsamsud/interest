<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Payout Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <h1 class="text-xl font-bold text-gray-800 mb-6">Monthly Payout Calculator</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-600">Principal ($)</label>
                <input type="number" id="principal" value="350000" oninput="calculate()"
                    class="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600">Annual Interest Rate (%)</label>
                <input type="number" id="rate" value="6.75" step="0.01" oninput="calculate()"
                    class="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="p-4 bg-blue-50 rounded-xl border border-blue-100">
                <p class="text-xs text-blue-600 font-bold uppercase tracking-wider">Estimated Monthly Payout</p>
                <p id="payout" class="text-3xl font-black text-blue-700">$0.00</p>
                <p class="text-[10px] text-blue-500 mt-1">*Calculated as (Principal × Rate) / 12</p>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const P = parseFloat(document.getElementById('principal').value);
            const r = parseFloat(document.getElementById('rate').value) / 100;

            if (isNaN(P) || isNaN(r)) return;

            // Simple Monthly Payout Formula
            const monthlyPayout = (P * r) / 12;

            document.getElementById('payout').innerText = `$${monthlyPayout.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }
        calculate();
    </script>
</body>
</html>
