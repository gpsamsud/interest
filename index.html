<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nominal Rate Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10 font-sans">

    <div class="max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">Interest Converter</h1>
            <p class="text-sm text-slate-500 mb-6">Convert Annual Effective Rate to a Monthly Nominal Rate.</p>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-600">Principal Amount ($)</label>
                    <input type="number" id="principal" value="10000" class="w-full mt-1 p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-600">Annual Effective Rate (%)</label>
                    <input type="number" id="effRate" value="10" step="0.01" class="w-full mt-1 p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-600">Investment Period (Years)</label>
                    <input type="number" id="years" value="1" class="w-full mt-1 p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition">
                </div>

                <button onclick="calculate()" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-xl hover:bg-emerald-700 shadow-lg shadow-emerald-200 transition-all active:scale-95">
                    Calculate Nominal Payout
                </button>
            </div>
        </div>

        <div class="space-y-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center">
                <p class="text-xs text-slate-500 uppercase font-bold tracking-wider italic">Calculated Lower Nominal Rate</p>
                <p id="nominalRateDisplay" class="text-3xl font-black text-emerald-600 mt-1">0.00%</p>
                <p class="text-[10px] text-slate-400 mt-1">(Compounded Monthly)</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-emerald-600 p-5 rounded-2xl text-white shadow-md">
                    <p class="text-xs opacity-80 uppercase font-bold tracking-wider">Monthly Payout</p>
                    <p id="monthlyPayout" class="text-xl font-bold mt-1">$0.00</p>
                </div>
                <div class="bg-slate-800 p-5 rounded-2xl text-white shadow-md">
                    <p class="text-xs opacity-80 uppercase font-bold tracking-wider">Total Interest</p>
                    <p id="totalInterest" class="text-xl font-bold mt-1">$0.00</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-48">
                <canvas id="rateChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let myChart;

        function calculate() {
            const P = parseFloat(document.getElementById('principal').value);
            const rEff = parseFloat(document.getElementById('effRate').value) / 100;
            const t = parseFloat(document.getElementById('years').value);

            if (isNaN(P) || isNaN(rEff) || isNaN(t)) return;

            // 1. Calculate Nominal Rate (j) compounded monthly
            // Formula: j = 12 * ((1 + rEff)^(1/12) - 1)
            const j = 12 * (Math.pow((1 + rEff), 1/12) - 1);
            const monthlyRate = j / 12;
            const monthlyPayout = P * monthlyRate;
            const totalInterest = monthlyPayout * (t * 12);

            // Update UI
            document.getElementById('nominalRateDisplay').innerText = (j * 100).toFixed(4) + "%";
            document.getElementById('monthlyPayout').innerText = `$${monthlyPayout.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('totalInterest').innerText = `$${totalInterest.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

            updateChart(rEff * 100, j * 100);
        }

        function updateChart(eff, nom) {
            const ctx = document.getElementById('rateChart').getContext('2d');
            if (myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Effective Annual', 'Nominal Monthly'],
                    datasets: [{
                        data: [eff, nom],
                        backgroundColor: ['#94a3b8', '#10b981'],
                        borderRadius: 8
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { grid: {display: false}, title: {display: true, text: 'Rate %'} } }
                }
            });
        }

        calculate();
    </script>
</body>
</html>
